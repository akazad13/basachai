# Tests on every push and pull request; on main, also builds, scans and publishes the API image.
# Deploys are manual (Actions > CI > Run workflow) through deploy/deploy.sh. The web app deploys through Netlify.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 1 * * *"   # nightly: the full test run, including the Cloudinary contract tests
    - cron: "0 3 1 * *"   # monthly: rebuild the API image for .NET and base image patches (security spec, Patching)
  workflow_dispatch:
    inputs:
      environment:
        description: "Deploy the image of this commit (main only) to"
        type: choice
        required: true
        default: staging
        options: [staging, production]
      skip_cloudinary:
        description: "Deploy without the Cloudinary contract tests (only if Cloudinary itself is down)"
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash   # -eo pipefail: a failing command inside a pipe fails the step

# One run per branch at a time, and deploys never overlap.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && 'deploy' || 'test' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  api:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "10.0.x" }
      # Domain tests, and API tests against PostgreSQL in Testcontainers. The Cloudinary contract tests run in their own job.
      - run: dotnet test --filter "Category!=Cloudinary"
      - name: Vulnerable NuGet packages
        run: |
          dotnet list package --vulnerable --include-transitive | tee vulnerable.txt
          ! grep -qE '\b(High|Critical)\b' vulnerable.txt

  web:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npx eslint .
      - run: npx tsc --noEmit
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
        env: { NEXT_PUBLIC_API_URL: "http://localhost:5080" }

  e2e:
    runs-on: ubuntu-24.04
    needs: [api, web]
    services:
      # A throwaway database that exists only inside this job, so the credentials are not secrets
      # (pull requests from forks and Dependabot get no secrets).
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: basachai
          POSTGRES_PASSWORD: ci-throwaway
          POSTGRES_DB: basachai_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U basachai" --health-interval 5s --health-retries 20
    env:
      ConnectionStrings__Main: Host=localhost;Port=5432;Database=basachai_test;Username=basachai;Password=ci-throwaway
      ASPNETCORE_ENVIRONMENT: Test
      ASPNETCORE_URLS: http://localhost:5080
      Auth__TestTotpBypass: "true"
      Web__Origin: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:5080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "10.0.x" }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - name: A test password for this run only
        run: |
          pw="$(openssl rand -hex 16)"
          echo "::add-mask::$pw"
          { echo "E2E_PASSWORD=$pw"; echo "Seed__Password=$pw"; } >> "$GITHUB_ENV"
      - name: Start the API (Test environment, with the seed and clock hooks)
        run: |
          dotnet build src/BasaChai.Api -c Release
          nohup dotnet run --project src/BasaChai.Api -c Release --no-build --no-launch-profile > api.log 2>&1 &
          timeout 120 bash -c 'until curl -fsS http://localhost:5080/health/ready; do sleep 2; done'
      - name: Build and start the web app
        working-directory: web
        run: |
          npm ci
          npm run build
          nohup npx next start -p 3000 > ../web.log 2>&1 &
          timeout 60 bash -c 'until curl -fsS http://localhost:3000/bn > /dev/null; do sleep 2; done'
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npx playwright test
        working-directory: web
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            web/playwright-report
            api.log
            web.log

  # PHOTO-API01 and 02 against the Cloudinary test account: nightly and before every deploy (photos spec).
  cloudinary:
    runs-on: ubuntu-24.04
    # Nightly (not again on the monthly rebuild) and before deploys.
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '0 1 * * *')
      || (github.event_name == 'workflow_dispatch' && !inputs.skip_cloudinary)
    env:
      Cloudinary__CloudName: ${{ secrets.CLOUDINARY_TEST_CLOUD }}
      Cloudinary__ApiKey: ${{ secrets.CLOUDINARY_TEST_KEY }}
      Cloudinary__ApiSecret: ${{ secrets.CLOUDINARY_TEST_SECRET }}
      REQUIRE_CLOUDINARY: "1"   # missing credentials fail the tests instead of skipping them
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "10.0.x" }
      - name: Require the test account
        run: |
          for v in Cloudinary__CloudName Cloudinary__ApiKey Cloudinary__ApiSecret; do
            [ -n "${!v}" ] || { echo "Set the CLOUDINARY_TEST_* secrets ($v is empty)"; exit 1; }
          done
      - run: dotnet test tests/BasaChai.Api.Tests --filter "Category=Cloudinary" --logger "console;verbosity=normal"

  image:
    runs-on: ubuntu-24.04
    needs: [e2e]
    # Only reviewed code on main becomes an image: on push, on deploy, and on the monthly rebuild (not nightly).
    if: >-
      github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch'
      || (github.event_name == 'schedule' && github.event.schedule == '0 3 1 * *'))
    permissions: { contents: read, packages: write }
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/basachai-api:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with: { context: ., file: deploy/api.Dockerfile, load: true, tags: "${{ steps.name.outputs.image }}" }
      - name: Scan the image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.name.outputs.image }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - run: docker push "${{ steps.name.outputs.image }}"

  deploy:
    runs-on: ubuntu-24.04
    needs: [image, cloudinary]
    # The contract tests must pass, unless the person deploying chose to skip them (Cloudinary outage).
    if: >-
      always() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
      && needs.image.result == 'success'
      && (needs.cloudinary.result == 'success' || (inputs.skip_cloudinary && needs.cloudinary.result == 'skipped'))
    # Add protection rules (required reviewers) to the "production" environment in the repository settings.
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - name: Release over SSH
        env:
          # DEPLOY_HOST is user@host; that user may sudo only basachai-release (setup-server.sh).
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          bash deploy/deploy.sh "$HOST" "${{ inputs.environment }}" "${{ needs.image.outputs.image }}"
