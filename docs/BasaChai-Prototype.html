<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light only">
<title>BasaChai Prototype</title>
<meta name="description" content="Clickable UI prototype of the BasaChai rental MVP for Dhamrai, with sample data.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Da+2:wght@500;600;700;800&family=Noto+Sans+Bengali:wght@400;500;600;700&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F4F6F2;
    --surface: #FFFFFF;
    --ink: #17231F;
    --muted: #586861;
    --line: #D8E0DA;
    --green: #0F5E50;
    --green-tint: #E2EEEA;
    --on-green: #FFFFFF;
    --brass: #B7862A;
    --brass-tint: #F5EBD5;
    --red: #A63D2A;
    --red-tint: #F6E3DE;
    --tile-l: 86%;
    --tile-s: 26%;
    --tile-ink-l: 42%;
    --display: "Baloo Da 2", "Noto Sans Bengali", system-ui, sans-serif;
    --sans: "Noto Sans Bengali", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  /* Light theme only, even when the device prefers dark. */
  :root { color-scheme: light; }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.75 var(--sans); }
  /* English mode: a rounded Latin body face that matches Baloo, with Latin line spacing.
     Noto Sans Bengali stays in the stack for Bangla names and the taka sign. */
  html[lang="en"] { --sans: "Nunito", "Noto Sans Bengali", system-ui, -apple-system, "Segoe UI", sans-serif; }
  html[lang="en"] body { line-height: 1.55; }
  html[lang="en"] h1, html[lang="en"] h2, html[lang="en"] h3 { letter-spacing: -0.01em; line-height: 1.2; }
  a { color: var(--green); }
  img, svg { display: block; }
  button, input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--brass); outline-offset: 2px; border-radius: 6px; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 0 16px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  h1, h2, h3 { font-family: var(--display); font-weight: 600; line-height: 1.25; margin: 0; }
  h1 { font-weight: 700; }
  h1 { font-size: 30px; }
  h2 { font-size: 22px; }
  h3 { font-size: 18px; }
  p { margin: 0 0 12px; }
  @media (min-width: 900px) { h1 { font-size: 40px; } h2 { font-size: 24px; } }

  /* Prototype strip */
  .proto { background: var(--brass-tint); border-bottom: 1px solid var(--line); font-size: 14px; }
  .proto .wrap { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; padding-top: 6px; padding-bottom: 6px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); padding: 2px; }
  .seg button { border: 0; background: none; padding: 2px 12px; border-radius: 999px; cursor: pointer; color: var(--muted); }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }

  /* Header */
  header.site { background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 30; }
  header.site .wrap { display: flex; align-items: center; gap: 12px; height: 64px; }
  .logo { display: flex; align-items: center; gap: 8px; text-decoration: none; color: var(--green); font-family: var(--display); font-weight: 700; font-size: 24px; line-height: 1; }
  .logo svg { color: var(--brass); }
  .lang { margin-left: auto; border: 1px solid var(--line); background: none; border-radius: 8px; padding: 4px 10px; cursor: pointer; font-size: 14px; }
  nav.main { display: flex; align-items: center; gap: 4px; }
  nav.main a, nav.main button.link { display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 8px; text-decoration: none; color: var(--ink); font-weight: 500; background: none; border: 0; cursor: pointer; position: relative; }
  nav.main a[aria-current="page"] { color: var(--green); background: var(--green-tint); }
  nav.main .count { background: var(--red); color: #fff; font-size: 12px; line-height: 1; padding: 3px 6px; border-radius: 999px; }
  nav.main .nav-icon { display: none; }
  @media (max-width: 760px) {
    body { padding-bottom: 68px; }
    nav.main { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; background: var(--surface); border-top: 1px solid var(--line); justify-content: space-around; height: 64px; padding: 0 4px; }
    nav.main a, nav.main button.link { flex-direction: column; gap: 0; font-size: 12px; padding: 6px 4px; flex: 1; justify-content: center; }
    nav.main .nav-icon { display: block; }
    nav.main .btn { padding: 6px 8px; font-size: 12px; flex-direction: column; gap: 0; }
    nav.main .count { position: absolute; top: 4px; right: calc(50% - 22px); }
  }

  /* Buttons */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 10px; padding: 10px 16px; font-weight: 600; line-height: 1.3; border: 1px solid transparent; cursor: pointer; text-decoration: none; }
  .btn-primary { background: var(--green); color: var(--on-green); }
  .btn-brass { background: var(--brass); color: #1D1606; }
  .btn-ghost { background: var(--surface); border-color: var(--line); color: var(--ink); }
  .btn-danger { background: var(--surface); border-color: var(--red); color: var(--red); }
  .btn-sm { padding: 6px 12px; font-size: 14px; border-radius: 8px; }
  .btn[disabled] { opacity: .5; cursor: not-allowed; }
  .linkish { background: none; border: 0; padding: 0; color: var(--green); text-decoration: underline; cursor: pointer; }

  /* Forms */
  label.f { display: block; font-weight: 600; font-size: 14px; margin-bottom: 4px; }
  .hint { font-size: 13px; color: var(--muted); }
  .err { font-size: 13px; color: var(--red); margin-top: 4px; }
  input[type="text"], input[type="number"], input[type="tel"], input[type="password"], input[type="date"], select, textarea {
    width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; min-height: 44px;
  }
  textarea { min-height: 96px; resize: vertical; }
  input[aria-invalid="true"], select[aria-invalid="true"] { border-color: var(--red); }
  .field { margin-bottom: 16px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .row3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  @media (max-width: 520px) { .row3 { grid-template-columns: 1fr 1fr; } }
  .checks { display: flex; flex-wrap: wrap; gap: 8px; }
  .check { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; background: var(--surface); cursor: pointer; font-size: 14px; }
  .check input { accent-color: var(--green); }
  .pills { display: flex; flex-wrap: wrap; gap: 6px; }
  .pills button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 14px; cursor: pointer; min-height: 36px; }
  .pills button[aria-pressed="true"] { background: var(--green); color: var(--on-green); border-color: var(--green); }

  /* Placeholder photo tile */
  .tile { position: relative; background: hsl(var(--h) var(--tile-s) var(--tile-l)); color: hsl(var(--h) 30% var(--tile-ink-l)); display: grid; place-items: center; overflow: hidden; border-radius: 10px; aspect-ratio: 4 / 3; }
  .tile svg { width: 46%; max-width: 160px; height: auto; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
  .tile img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .tile .tag { z-index: 1; }
  .tile .tag { position: absolute; left: 8px; bottom: 8px; font-size: 12px; background: var(--surface); color: var(--muted); padding: 1px 8px; border-radius: 999px; }

  /* Receipt: the signature element */
  .receipt { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; }
  .receipt h3 { font-size: 16px; margin-bottom: 8px; }
  .r-row { display: flex; align-items: baseline; gap: 8px; font-size: 15px; }
  .r-row + .r-row { margin-top: 4px; }
  .r-row .dots { flex: 1; border-bottom: 2px dotted var(--line); transform: translateY(-5px); min-width: 16px; }
  .r-row .amt { font-variant-numeric: tabular-nums; font-weight: 600; }
  .r-row .amt.na { color: var(--muted); font-weight: 400; }
  .r-total { margin-top: 10px; padding-top: 8px; border-top: 4px double var(--brass); display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .r-total .lbl { font-weight: 600; }
  .r-total .amt { font-family: var(--display); font-weight: 700; font-size: 30px; line-height: 1.2; }
  .r-note { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .r-once { margin-top: 12px; background: var(--brass-tint); border-radius: 10px; padding: 8px 12px; }
  .r-once .r-head { font-size: 13px; color: var(--muted); margin-bottom: 2px; }

  /* Home */
  .hero { display: grid; gap: 28px; padding: 32px 0 24px; align-items: start; }
  @media (min-width: 900px) { .hero { grid-template-columns: 1.25fr .75fr; padding: 56px 0 40px; gap: 48px; } }
  .hero h1 { max-width: 16ch; }
  .hero .sub { font-size: 18px; color: var(--muted); margin: 12px 0 24px; max-width: 46ch; }
  .search-card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; display: grid; gap: 12px; }
  @media (min-width: 640px) { .search-card { grid-template-columns: 1.4fr 1fr 1fr auto; align-items: end; } }
  .search-card .field { margin: 0; }
  .hero-aside .cap { font-size: 14px; color: var(--muted); margin: 10px 4px 0; }
  .hero-aside .receipt { border-color: var(--brass); }
  .section { padding: 28px 0; }
  .section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
  .steps { list-style: none; padding: 0; margin: 0; display: grid; gap: 16px; counter-reset: s; }
  @media (min-width: 760px) { .steps { grid-template-columns: repeat(3, 1fr); } }
  .steps li { counter-increment: s; border-top: 2px solid var(--green); padding-top: 12px; }
  .steps li::before { content: counter(s, bengali); font-family: var(--display); font-weight: 700; font-size: 26px; color: var(--green); display: block; line-height: 1.2; }
  :root[lang="en"] .steps li::before, html[lang="en"] .steps li::before { content: counter(s); }
  .steps h3 { font-size: 17px; margin: 4px 0; }
  .steps p { color: var(--muted); margin: 0; }
  .safety { display: flex; gap: 16px; align-items: flex-start; background: var(--green-tint); border-radius: 14px; padding: 16px 18px; }
  .safety svg { flex: none; color: var(--green); margin-top: 4px; }
  .safety h3 { font-size: 17px; margin-bottom: 4px; }
  .safety p { margin: 0; }

  /* Cards */
  .cards { display: grid; gap: 16px; }
  .cards.grid3 { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
  /* Home page: 4 recent homes as 1 / 2x2 / 4 across, so no row is left with a lone card. */
  .cards.grid4 { grid-template-columns: 1fr; }
  @media (min-width: 600px) { .cards.grid4 { grid-template-columns: repeat(2, 1fr); } }
  @media (min-width: 1100px) { .cards.grid4 { grid-template-columns: repeat(4, 1fr); } }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; display: grid; }
  .card .card-photo { display: block; }
  .card .tile { border-radius: 0; }
  .card-body { padding: 14px 16px 16px; display: grid; gap: 6px; align-content: start; }
  .card-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .fresh { font-size: 13px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
  .fresh::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--green); }
  .fresh.old::before { background: var(--brass); }
  .card h3 { font-size: 17px; }
  .card h3 a { color: inherit; text-decoration: none; }
  .card h3 a:hover { text-decoration: underline; }
  .card .area { color: var(--muted); font-size: 14px; margin: 0; }
  .facts { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 14px; }
  .card-cost { margin-top: 6px; padding-top: 8px; border-top: 4px double var(--brass); }
  .card-cost .row { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .card-cost .lbl { font-size: 14px; font-weight: 600; }
  .card-cost .amt { font-family: var(--display); font-weight: 700; font-size: 24px; line-height: 1.25; }
  .card-cost .split { font-size: 13px; color: var(--muted); }
  .save-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 10px; cursor: pointer; font-size: 13px; display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; flex: none; }
  .card-top .fresh { min-width: 0; line-height: 1.4; }
  .save-btn[aria-pressed="true"] { color: var(--brass); border-color: var(--brass); }
  @media (min-width: 640px) { .cards.list .card { grid-template-columns: 260px 1fr; } .cards.list .card .tile { height: 100%; aspect-ratio: auto; min-height: 200px; } }

  /* Results */
  .results { display: grid; gap: 24px; padding: 24px 0 40px; }
  @media (min-width: 861px) { .results { grid-template-columns: 280px 1fr; align-items: start; } }
  .filters { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
  .filters h2 { font-size: 18px; margin-bottom: 12px; }
  .filters .field { margin-bottom: 14px; }
  .filters .sheet-actions { display: none; }
  @media (min-width: 861px) { .filters { position: sticky; top: 80px; max-height: calc(100vh - 96px); overflow: auto; } }
  @media (max-width: 860px) {
    .filters { display: none; position: fixed; inset: auto 0 0 0; z-index: 60; max-height: 86vh; overflow: auto; border-radius: 18px 18px 0 0; box-shadow: 0 -8px 30px rgba(10, 30, 25, .25); padding-bottom: 88px; }
    body.filters-open .filters { display: block; }
    body.filters-open::after { content: ""; position: fixed; inset: 0; background: rgba(10, 25, 20, .4); z-index: 55; }
    .filters .sheet-actions { display: flex; gap: 8px; position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px; background: var(--surface); border-top: 1px solid var(--line); z-index: 61; }
    .filters .sheet-actions .btn { flex: 1; }
  }
  .results-head { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .results-head .count { font-weight: 600; }
  .results-head select { width: auto; min-height: 40px; }
  .filter-btn { display: none; }
  @media (max-width: 860px) { .filter-btn { display: inline-flex; } }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  .chip { display: inline-flex; align-items: center; gap: 4px; background: var(--green-tint); color: var(--ink); border-radius: 999px; padding: 2px 4px 2px 12px; font-size: 14px; }
  .chip button { border: 0; background: none; cursor: pointer; width: 26px; height: 26px; border-radius: 50%; font-size: 16px; line-height: 1; color: var(--muted); }
  .empty { background: var(--surface); border: 1px dashed var(--line); border-radius: 14px; padding: 28px 20px; text-align: center; }
  .empty h2 { font-size: 20px; margin-bottom: 6px; }
  .empty .actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 14px; }

  /* Detail */
  .crumb { padding: 16px 0 0; font-size: 14px; }
  .detail { display: grid; gap: 20px; padding: 12px 0 40px; grid-template-columns: minmax(0, 1fr); grid-template-areas: "gal" "head" "side" "body"; }
  .detail > * { min-width: 0; }
  .head h1 { overflow-wrap: anywhere; }
  @media (min-width: 900px) { .detail { grid-template-columns: minmax(0, 1fr) 360px; gap: 24px 32px; grid-template-areas: "gal side" "head side" "body side"; } .detail .side { position: sticky; top: 80px; align-self: start; } }
  .detail .gal { grid-area: gal; }
  .detail .head { grid-area: head; }
  .detail .side { grid-area: side; display: grid; gap: 14px; }
  .detail .body { grid-area: body; display: grid; gap: 24px; }
  .gal .main .tile { border-radius: 14px; aspect-ratio: 16 / 10; max-height: 56vh; width: 100%; }
  .thumbs { display: flex; gap: 8px; margin-top: 8px; overflow-x: auto; padding-bottom: 4px; }
  .thumbs button { border: 2px solid transparent; padding: 0; background: none; border-radius: 10px; cursor: pointer; flex: none; width: 84px; }
  .thumbs button[aria-current="true"] { border-color: var(--brass); }
  .thumbs .tile svg { width: 60%; }
  .head .meta { display: flex; flex-wrap: wrap; gap: 6px 14px; color: var(--muted); font-size: 14px; margin-top: 6px; }
  .facts-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .facts-grid div { background: var(--surface); padding: 10px 14px; }
  .facts-grid dt { font-size: 13px; color: var(--muted); }
  .facts-grid dd { margin: 0; font-weight: 600; }
  .amen { display: flex; flex-wrap: wrap; gap: 8px; list-style: none; padding: 0; margin: 0; }
  .amen li { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 2px 12px; font-size: 14px; }
  .body h2 { font-size: 19px; margin-bottom: 8px; }
  .advertiser { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; display: grid; gap: 10px; }
  .adv-who { display: flex; gap: 12px; align-items: center; }
  .avatar { width: 44px; height: 44px; border-radius: 50%; background: var(--green-tint); color: var(--green); display: grid; place-items: center; font-family: var(--display); font-weight: 700; font-size: 18px; flex: none; }
  .badge { display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px; padding: 1px 10px; border-radius: 999px; font-weight: 600; white-space: nowrap; }
  .b-muted { background: var(--paper); color: var(--muted); border: 1px solid var(--line); }
  .b-green { background: var(--green-tint); color: var(--green); }
  .b-brass { background: var(--brass-tint); color: var(--ink); }
  .b-red { background: var(--red-tint); color: var(--red); }
  .phone-big { font-family: var(--display); font-size: 26px; font-weight: 700; letter-spacing: .02em; }
  .warn-line { font-size: 13.5px; color: var(--muted); display: flex; gap: 6px; }
  .side-actions { display: flex; gap: 8px; flex-wrap: wrap; }

  /* Post */
  .post { padding: 24px 0 48px; display: grid; gap: 24px; }
  @media (min-width: 960px) { .post { grid-template-columns: 1fr 340px; align-items: start; } .post .preview { position: sticky; top: 80px; } }
  .stepper { list-style: none; padding: 0; margin: 16px 0 24px; display: flex; gap: 6px; flex-wrap: wrap; }
  .stepper li { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); padding: 4px 12px 4px 4px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); }
  .stepper .n { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--paper); font-weight: 700; }
  .stepper li[aria-current="step"] { color: var(--ink); border-color: var(--green); }
  .stepper li[aria-current="step"] .n { background: var(--green); color: var(--on-green); }
  .stepper li.done .n { background: var(--green-tint); color: var(--green); }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 20px; }
  .panel h2 { font-size: 20px; margin-bottom: 14px; }
  .form-nav { display: flex; justify-content: space-between; gap: 8px; margin-top: 8px; }
  .other-row { display: grid; grid-template-columns: 1fr 120px 130px 40px; gap: 8px; align-items: center; margin-bottom: 8px; }
  @media (max-width: 560px) { .other-row { grid-template-columns: 1fr 1fr; } }
  .icon-btn { width: 40px; height: 40px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-size: 18px; line-height: 1; }
  .photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; margin: 14px 0; }
  .photo-item { display: grid; gap: 6px; }
  .photo-item .ops { display: flex; gap: 4px; justify-content: space-between; }
  .photo-item .ops button { flex: 1; height: 32px; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; cursor: pointer; font-size: 13px; }
  .add-tile { border: 2px dashed var(--line); border-radius: 10px; aspect-ratio: 4 / 3; display: grid; place-items: center; background: none; cursor: pointer; color: var(--green); font-weight: 600; }
  .add-tile:hover { border-color: var(--green); }
  .uploading { aspect-ratio: 4 / 3; border-radius: 10px; background: var(--paper); border: 1px solid var(--line); display: grid; place-items: center; font-size: 13px; color: var(--muted); }
  .success { text-align: center; padding: 40px 20px; }
  .success .mark { width: 64px; height: 64px; border-radius: 50%; background: var(--green-tint); color: var(--green); display: grid; place-items: center; margin: 0 auto 16px; }

  /* Dashboard */
  .dash { padding: 24px 0 48px; }
  .dash-head { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  .alerts { display: grid; gap: 10px; margin-bottom: 24px; }
  .alert { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; border-radius: 12px; padding: 12px 16px; border: 1px solid; }
  .alert p { margin: 0; flex: 1 1 280px; }
  .alert.brass { background: var(--brass-tint); border-color: var(--brass); }

  .lrow h3 { font-size: 16px; }

  .lrow .acts { display: flex; flex-wrap: wrap; gap: 6px; }
  .reason { font-size: 14px; background: var(--paper); border-left: 3px solid var(--red); padding: 6px 10px; border-radius: 0 8px 8px 0; margin: 4px 0 8px; }

  /* Admin */
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; margin-bottom: 28px; }
  .stats div { background: var(--surface); padding: 12px 16px; }
  .stats .v { font-family: var(--display); font-size: 26px; font-weight: 700; line-height: 1.3; }
  .stats .k { font-size: 13.5px; color: var(--muted); }
  .stats .v.red { color: var(--red); }
  .qcard { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 14px; }
  .qcard + .qcard { margin-top: 12px; }
  @media (min-width: 860px) { .qcard { grid-template-columns: 1fr 300px; } }
  .qcard .mini-tiles { display: flex; gap: 6px; margin: 8px 0; }
  .qcard .mini-tiles .tile { width: 72px; }
  .qcard .mini-tiles .tile svg { width: 60%; }
  .qcard .acts { display: flex; flex-wrap: wrap; gap: 8px; grid-column: 1 / -1; border-top: 1px solid var(--line); padding-top: 12px; }
  .admin-cols { display: grid; gap: 32px; }
  .rep { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
  .rep + .rep { margin-top: 10px; }
  .rep .top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
  .rep blockquote { margin: 8px 0; font-size: 14.5px; color: var(--ink); background: var(--paper); padding: 8px 12px; border-radius: 8px; }
  .rep .acts { display: flex; gap: 8px; flex-wrap: wrap; }

  /* Dialog, toast, footer */
  dialog { border: 0; border-radius: 16px; padding: 0; width: min(480px, calc(100vw - 32px)); background: var(--surface); color: var(--ink); }

  .dlg { padding: 20px; }
  .dlg h2 { font-size: 20px; margin-bottom: 12px; }
  .dlg .acts { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
  .radio-list { display: grid; gap: 6px; margin-bottom: 12px; }
  .radio-list label { display: flex; gap: 10px; align-items: center; border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; cursor: pointer; }
  .radio-list input { accent-color: var(--green); }
  #toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); background: var(--ink); color: var(--paper); padding: 10px 18px; border-radius: 10px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 100; max-width: calc(100vw - 32px); font-size: 15px; }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  @media (max-width: 760px) { #toast { bottom: 84px; } }
  footer.site { border-top: 1px solid var(--line); padding: 24px 0 32px; color: var(--muted); font-size: 14px; }
  footer.site ul { list-style: none; padding: 0; margin: 0 0 8px; display: flex; flex-wrap: wrap; gap: 6px 18px; }
  footer.site a { color: var(--muted); }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }

function receipt(l, { title = true } = {}) {
  const rows = [];
  rows.push(row(t('rent'), money(l.rent)));

  for (const o of l.others.filter(o => o.rec)) rows.push(row(loc(o.label), o.amount != null ? money(o.amount) : t('meter'), o.amount == null));
  const unknown = l.others.filter(o => o.rec && o.amount == null).map(o => loc(o.label));
  const once = [row(t('advance'), l.advance != null ? money(l.advance) : t('not_specified'), l.advance == null)];
  for (const o of l.others.filter(o => !o.rec)) once.push(row(loc(o.label), o.amount != null ? money(o.amount) : t('not_specified'), o.amount == null));

const FKEYS = ['area', 'min', 'max', 'beds', 'baths', 'type', 'furnish', 'occ', 'avail', 'sort'];
function readFilters(q) { const f = {}; for (const k of FKEYS) f[k] = q.get(k) ?? ''; if (!f.sort) f.sort = 'confirmed'; return f; }
function writeFilters(f) {
  const q = new URLSearchParams();
  for (const k of FKEYS) if (f[k] !== '' && f[k] != null && !(k === 'sort' && f[k] === 'confirmed')) q.set(k, f[k]);
  const s = q.toString(); location.hash = '#/search' + (s ? '?' + s : '');
}
function match(l, f) {
  if (!isPublic(l)) return false;
  if (f.area && l.area !== f.area) return false;
  if (f.min && l.rent < +f.min) return false;
  if (f.max && l.rent > +f.max) return false;
  if (f.beds !== '' && l.beds !== +f.beds) return false;
  if (f.baths !== '' && l.baths !== +f.baths) return false;
  if (f.type && l.type !== f.type) return false;
  if (f.furnish && l.furnish !== f.furnish) return false;
  if (f.occ && !(l.occ === f.occ || l.occ === 'any')) return false;
  if (f.avail === 'now' && l.availIn > 0) return false;
  if (f.avail === 'month' && l.availIn > 30) return false;
  return true;
}

/* Drafts and edits: the form is saved to a listing so owners can leave and come back */
function formFromListing(l) {

function applyForm(l) {

function saveDraft() {
  let l = S.editId && byId(S.editId);

}

function liveEdit() { const l = S.editId && byId(S.editId); return !!l && l.status === 'published'; }
function startNew() { if (S.editId) { S.editId = null; S.draft = newDraft(); S.step = 1; S.errors = {}; } S.submitted = false; }
function validateStep() {
  const d = S.draft, e = {};
  if (S.step === 1) { if (!d.title.trim()) e.title = 1; if (!d.area) e.area = 1; if (!d.availNow && !d.availDate) e.availDate = 1; }
  if (S.step === 2) { if (d.rent === '' || +d.rent <= 0) e.rent = 1; if (d.service === '') e.service = 1; if (!d.advNone && d.advance === '') e.advance = 1; }
  if (S.step === 3 && d.photos.length < 3) e.photos = 1;
  S.errors = e; return !Object.keys(e).length;
}

/* Owner dashboard */
function viewDashboard() {
  if (S.role !== 'owner') return `<div class="empty" style="margin:40px 0"><p>${t('signin_why_post')}</p><div class="actions"><button class="btn btn-primary" data-act="role" data-id="owner">${t('view_owner')}</button></div></div>`;
  const mine = LISTINGS.filter(l => l.owner === 'me' && l.status !== 'archived');
  const alerts = [];
  for (const l of mine) {
    const s = eff(l), title = esc(loc(l.title));
    if (s === 'published' && expiresIn(l) <= 3) alerts.push(`<div class="alert brass"><p>${t('al_expiring', { x: title, n: num(expiresIn(l)) })}</p><div class="acts"><button class="btn btn-primary btn-sm" data-act="reconfirm" data-id="${l.id}">${t('reconfirm')}</button></div></div>`);
    if (s === 'expired') alerts.push(`<div class="alert red"><p>${t('al_expired', { x: title })}</p><div class="acts"><button class="btn btn-primary btn-sm" data-act="renew" data-id="${l.id}">${t('renew')}</button></div></div>`);
    if (s === 'changes') alerts.push(`<div class="alert red"><p>${t('al_changes', { x: title })}</p><div class="acts"><button class="btn btn-ghost btn-sm" data-act="edit" data-id="${l.id}">${t('edit')}</button></div></div>`);
  }
  const order = { changes: 0, draft: 1, expired: 2, pending: 3, published: 4, paused: 5, rented: 6, rejected: 7 };
  const rows = mine.sort((a, b) => (order[eff(a)] ?? 9) - (order[eff(b)] ?? 9)).map(l => {
    const s = eff(l);
    const acts = [];
    if (s === 'draft') acts.push(['continue', 'btn-primary'], ['archive', 'btn-ghost']);
    if (s === 'published') acts.push(['reconfirm', 'btn-ghost'], ['pause', 'btn-ghost'], ['mark-rented', 'btn-ghost'], ['edit', 'btn-ghost']);
    if (s === 'paused') acts.push(['resume', 'btn-ghost'], ['mark-rented', 'btn-ghost']);
    if (s === 'expired') acts.push(['renew', 'btn-primary'], ['archive', 'btn-ghost']);
    if (s === 'changes') acts.push(['edit', 'btn-primary'], ['archive', 'btn-ghost']);
    if (s === 'rented' || s === 'rejected') acts.push(['archive', 'btn-ghost']);
    const sub = [];
    if (s === 'published' || s === 'paused') sub.push(t('days_left', { n: num(expiresIn(l)) }));
    if (s === 'pending') sub.push(t('mod_review'));
    if (l.views) sub.push(t('views_n', { n: num(l.views) }));
    if (l.reveals) sub.push(t('reveals_n', { n: num(l.reveals) }));
    const label = { 'mark-rented': 'mark_rented' };
    return `<article class="lrow">${photoTile(l, 0, { small: true, w: 240 })}
      <div><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">${statusBadge(s)}<span class="hint">${money(monthly(l))} / ${t('total_month')}</span></div>
        <h3 style="margin-top:4px">${s === 'published' ? `<a href="#/listing/${l.id}" style="color:inherit">${L(l.title)}</a>` : L(l.title)}</h3>
        <div class="sub">${sub.map(x => `<span>${x}</span>`).join('')}</div>
        ${(s === 'changes' || s === 'rejected') && l.reason ? `<div class="reason"><strong>${t('mod_reason')}:</strong> ${L(l.reason)}</div>` : ''}
        ${acts.length ? `<div class="acts">${acts.map(([a, c]) => `<button class="btn ${c} btn-sm" data-act="${a}" data-id="${l.id}">${t(label[a] || a)}</button>`).join('')}</div>` : ''}</div></article>`;
  }).join('');
  return `<div class="dash"><div class="dash-head"><h1 style="font-size:28px">${t('dash_t')}</h1><a class="btn btn-primary" href="#/post" data-act="new-listing">${t('new_listing')}</a></div>
    ${alerts.length ? `<div class="alerts" role="region" aria-label="${esc(t('dash_t'))}">${alerts.join('')}</div>` : ''}
    ${rows || `<p>${t('no_listings')}</p>`}</div>`;
}

        <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><span class="hint">${esc(t('submitted_ago', { t: agoHours(l.submittedHours) }))}</span>${l.submittedHours > 24 ? `<span class="badge b-red">${t('overdue')}</span>` : ''}</div>
        <h3 style="margin-top:4px">${L(l.title)}</h3>
        <p class="hint" style="margin:0;display:flex;gap:12px;flex-wrap:wrap"><span>${L(AREAS[l.area])}</span><span>${esc(loc(p))}</span></p>
        <div class="mini-tiles">${Array.from({ length: Math.min(l.photos, 4) }, (_, i) => photoTile(l, i, { small: true, w: 200 })).join('')}</div>
        <p class="hint" style="margin:0">${t('photos_count', { n: num(l.photos) })}</p>
        ${loc(l.desc) ? `<p style="margin-top:8px">${L(l.desc)}</p>` : ''}
      </div>
      ${receipt(l, { title: false })}
      <div class="acts"><button class="btn btn-primary btn-sm" data-act="approve" data-id="${l.id}">${t('approve')}</button>
        <button class="btn btn-ghost btn-sm" data-act="mod-changes" data-id="${l.id}">${t('request_changes')}</button>
        <button class="btn btn-danger btn-sm" data-act="mod-reject" data-id="${l.id}">${t('reject')}</button></div></article>`;
  }).join('');
  const r = reps.map(rp => {
    const l = byId(rp.listing);
    return `<article class="rep"><div class="top"><span class="badge ${rp.reason === 'suspicious' ? 'b-red' : 'b-brass'}">${t('r_' + rp.reason)}</span>
        <span class="hint">${esc(t('reported_ago', { t: agoHours(rp.hours) }))}${rp.hours > 24 ? ` <span class="badge b-red">${t('overdue')}</span>` : ''}</span></div>
      <h3 style="margin:6px 0 0;font-size:16px"><a href="#/listing/${l.id}">${L(l.title)}</a></h3>
      ${loc(rp.details) ? `<blockquote>${L(rp.details)}</blockquote>` : ''}
      <div class="acts"><button class="btn btn-danger btn-sm" data-act="rep-hide" data-id="${rp.id}">${t('hide_listing')}</button><button class="btn btn-ghost btn-sm" data-act="rep-dismiss" data-id="${rp.id}">${t('dismiss')}</button></div></article>`;
  }).join('');
  return `<div class="dash"><div class="dash-head"><h1 style="font-size:28px">${t('admin_t')}</h1></div>
    <div class="stats"><div><div class="v">${num(queue.length)}</div><div class="k">${t('s_pending')}</div></div>
      <div><div class="v">${num(live)}</div><div class="k">${t('s_live')}</div></div>
      <div><div class="v">${num(reps.length)}</div><div class="k">${t('s_reports')}</div></div>
      <div><div class="v${overdue ? ' red' : ''}">${num(overdue)}</div><div class="k">${t('s_overdue')}</div></div></div>
    <div class="admin-cols">
      <section><h2 style="margin-bottom:12px">${t('queue_t')}</h2>${q || `<div class="empty"><p>${t('queue_empty')}</p></div>`}</section>
      <section><h2 style="margin-bottom:12px">${t('reports_t')}</h2>${r || `<div class="empty"><p>${t('reports_empty')}</p></div>`}</section>
    </div></div>`;
}

/* ---------- Dialogs ---------- */
function openDialog(html) { const d = $('#dlg'); d.innerHTML = html; if (!d.open) d.showModal(); const f = d.querySelector('input, select, textarea, button'); if (f) f.focus(); }
function closeDialog() { const d = $('#dlg'); if (d.open) d.close(); }
function signinDialog(why, signup = false) {
  S.signinWhy = why; S.signup = signup;
  openDialog(`<form class="dlg" id="signin-form" novalidate><h2 id="dlg-title">${t(signup ? 'create_account' : 'signin_t')}</h2>${why ? `<p>${t(why)}</p>` : ''}
    ${signup ? `<div class="field"><label class="f" for="s-name">${t('name')}</label><input id="s-name" type="text" autocomplete="name"><p class="err" id="s-name-err" hidden>${t('required')}</p></div>` : ''}
    <div class="field"><label class="f" for="s-phone">${t('phone')}</label><input id="s-phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="${digitsLocal('01712345678')}"><p class="err" id="s-phone-err" hidden>${t('phone_err')}</p></div>
    <div class="field"><label class="f" for="s-pass">${t('password')}</label><input id="s-pass" type="password" autocomplete="${signup ? 'new-password' : 'current-password'}"><p class="err" id="s-pass-err" hidden>${t('pass_err')}</p></div>
    <p class="hint">${t('signin_note')}</p>
    <p><button type="button" class="linkish" data-act="auth-mode">${t(signup ? 'signin_btn' : 'create_account')}</button></p>
    <div class="acts"><button type="button" class="btn btn-ghost" data-act="dlg-close">${t('cancel')}</button><button class="btn btn-primary" type="submit">${t(signup ? 'create_account' : 'signin_btn')}</button></div></form>`);
}
function reportDialog(id) {
  const rs = ['suspicious', 'inaccurate', 'duplicate', 'unavailable'];
  openDialog(`<form class="dlg" id="report-form" data-id="${id}" novalidate><h2 id="dlg-title">${t('report_t')}</h2>
    <div class="radio-list" role="radiogroup" aria-labelledby="dlg-title">${rs.map(r => `<label><input type="radio" name="reason" value="${r}">${t('r_' + r)}</label>`).join('')}</div>
    <p class="err" id="r-err" hidden>${t('pick_reason')}</p>
    <label class="f" for="r-details">${t('r_details')}</label><textarea id="r-details" name="details"></textarea>
    <div class="acts"><button type="button" class="btn btn-ghost" data-act="dlg-close">${t('cancel')}</button><button class="btn btn-primary" type="submit">${t('send_report')}</button></div></form>`);
}
function reasonDialog(id, kind) {
  openDialog(`<form class="dlg" id="reason-form" data-id="${id}" data-kind="${kind}" novalidate><h2 id="dlg-title">${t(kind === 'changes' ? 'reason_t_changes' : 'reason_t_reject')}</h2>
    <label class="f" for="m-reason">${t('reason_label')}</label><textarea id="m-reason"></textarea><p class="err" id="m-err" hidden>${t('reason_err')}</p>
    <div class="acts"><button type="button" class="btn btn-ghost" data-act="dlg-close">${t('cancel')}</button><button class="btn ${kind === 'changes' ? 'btn-primary' : 'btn-danger'}" type="submit">${t('send')}</button></div></form>`);
}

/* ---------- Router ---------- */
function parse() { const h = location.hash.slice(1) || '/'; const [p, qs] = h.split('?'); return { parts: p.split('/').filter(Boolean), q: new URLSearchParams(qs || '') }; }
function render() {
  document.documentElement.lang = S.lang;
  const { parts, q } = parse();
  const path = parts[0] || '';
  let view;
  if (path === 'search') view = viewSearch(q);
  else if (path === 'listing') view = viewDetail(parts[1]);
  else if (path === 'post') view = viewPost();
  else if (path === 'dashboard') view = viewDashboard();
  else if (path === 'admin') view = viewAdmin();
  else if (path === 'saved') view = viewSaved();
  else view = viewHome();
  document.body.classList.toggle('filters-open', path === 'search' && S.filtersOpen);
  $('#app').innerHTML = protoBar() + header(path) + `<main id="main" class="wrap">${view}</main>` + footer();
  const full = parts.join('/');
  if (full !== S.lastPath) { window.scrollTo(0, 0); S.lastPath = full; }
}
function go(hash) { if (location.hash === hash) render(); else location.hash = hash; }

/* ---------- Actions ---------- */
const A = {
  lang() { S.lang = S.lang === 'bn' ? 'en' : 'bn'; try { localStorage.setItem('basachai-lang', S.lang); } catch (e) { /* ignore */ } render(); },
  role(id) { S.role = id; S.signedIn = id !== 'tenant' ? true : S.signedIn; go(id === 'owner' ? '#/dashboard' : id === 'admin' ? '#/admin' : '#/'); },
  signin() { S.pending = null; signinDialog(''); },
  'nav-post'() { if (S.signedIn) { S.role = 'owner'; startNew(); go('#/post'); } else { S.pending = { k: 'post' }; signinDialog('signin_why_post'); } },
  save(id) {
    if (!S.signedIn) { S.pending = { k: 'save', id }; signinDialog('signin_why_save'); return; }
    if (S.saved.has(id)) { S.saved.delete(id); toast(t('toast_unsaved')); } else { S.saved.add(id); toast(t('toast_saved')); }
    render();
  },
  reveal(id) {
    if (S.revealCount >= 10) { S.revealBlocked = id; render(); return; }  /* 10 per hour, as in trust and safety */
    S.revealCount++; S.revealBlocked = null; S.revealed.add(id); const l = byId(id); l.reveals++; render();
  },
  'auth-mode'() { signinDialog(S.signinWhy, !S.signup); },
  report(id) { reportDialog(id); },
  'dlg-close'() { closeDialog(); },
  gal(id, el) { S.gal[id] = +el.dataset.i; render(); },
  'open-filters'() { S.filtersOpen = true; render(); const f = $('#f-area'); if (f) f.focus(); },
  'close-filters'() { S.filtersOpen = false; render(); },
  'reset-filters'() { const f = readFilters(parse().q); writeFilters({ sort: f.sort }); },
  'clear-filter'(keys) { const f = readFilters(parse().q); for (const k of keys.split(',')) f[k] = ''; writeFilters(f); },
  'avail-now'() { S.draft.availNow = true; render(); },
  'avail-date'() { S.draft.availNow = false; render(); },
  'other-add'() { S.draft.others.push({ label: '', amount: '', rec: true }); render(); },
  'other-del'(_, el) { S.draft.others.splice(+el.dataset.i, 1); render(); },
  'ph-add'() {
    if (S.uploading) return; S.uploading = true; render();
    setTimeout(() => { S.uploading = false; S.draft.photos.push(UPLOAD_POOL[S.draft.photos.length % UPLOAD_POOL.length]); delete S.errors.photos; render(); }, 600);
  },
  'ph-del'(_, el) { S.draft.photos.splice(+el.dataset.i, 1); render(); },
  'ph-left'(_, el) { const i = +el.dataset.i, p = S.draft.photos; [p[i - 1], p[i]] = [p[i], p[i - 1]]; render(); },
  'ph-right'(_, el) { const i = +el.dataset.i, p = S.draft.photos; [p[i + 1], p[i]] = [p[i], p[i + 1]]; render(); },
  'post-next'() { if (!liveEdit()) autosave(); if (validateStep()) { S.step++; S.errors = {}; if (!liveEdit()) autosave(); } render(); const e = document.querySelector('[aria-invalid="true"]'); if (e) e.focus(); else window.scrollTo(0, 0); },
  'post-prev'() { S.step--; S.errors = {}; render(); window.scrollTo(0, 0); },
  'post-submit'() {
    const l = S.editId && byId(S.editId);
    if (l) { applyForm(l); Object.assign(l, { status: 'pending', submittedHours: 0 }); delete l.form; delete l.step; delete l.reason; }
    else LISTINGS.push(Object.assign(previewListing(), { id: 'N' + Date.now(), status: 'pending', submittedHours: 0, confirmedAgo: undefined, title: { bn: S.draft.title, en: S.draft.title } }));
    S.editId = null; S.submitted = true; render(); window.scrollTo(0, 0);
  },
  'save-live'() {
    if (!validateStep()) { render(); return; }
    applyForm(byId(S.editId)); S.editId = null; S.draft = newDraft(); S.step = 1; S.errors = {};
    toast(t('t_saved_live')); go('#/dashboard');
  },
  'post-again'() { S.editId = null; S.draft = newDraft(); S.step = 1; S.submitted = false; S.errors = {}; render(); },
  'new-listing'() { startNew(); go('#/post'); },
  continue(id) {
    const l = byId(id); S.draft = l.form || formFromListing(l); l.form = S.draft;
    S.editId = id; S.step = l.step || 1; S.errors = {}; S.submitted = false; go('#/post');
  },
  reconfirm(id) { const l = byId(id); l.status = 'published'; l.confirmedAgo = 0; toast(t('t_reconfirmed')); render(); },
  renew(id) { const l = byId(id); l.status = 'published'; l.confirmedAgo = 0; toast(t('t_renewed')); render(); },
  pause(id) { byId(id).status = 'paused'; toast(t('t_paused')); render(); },
  resume(id) { byId(id).status = 'published'; toast(t('t_resumed')); render(); },
  'mark-rented'(id) { byId(id).status = 'rented'; toast(t('t_rented')); render(); },
  archive(id) { byId(id).status = 'archived'; if (S.editId === id) startNew(); toast(t('t_archived')); render(); },
  edit(id) { S.draft = formFromListing(byId(id)); S.editId = id; S.step = 1; S.errors = {}; S.submitted = false; go('#/post'); },
  approve(id) { const l = byId(id); l.status = 'published'; l.confirmedAgo = 0; l.createdAgo = 0; toast(t('t_approved')); render(); },
  'mod-changes'(id) { reasonDialog(id, 'changes'); },
  'mod-reject'(id) { reasonDialog(id, 'rejected'); },
  'rep-hide'(id) {  /* hiding closes every open report on that listing */
    const lid = REPORTS.find(x => x.id === id).listing;
    for (const r of REPORTS) if (r.listing === lid) r.open = false;
    byId(lid).hidden = true; toast(t('t_hidden')); render();
  },
  'rep-dismiss'(id) { REPORTS.find(x => x.id === id).open = false; toast(t('t_dismissed')); render(); }
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const fn = A[el.dataset.act];
  if (fn) { e.preventDefault(); fn(el.dataset.id, el); }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.filter) { const f = readFilters(parse().q); f[el.dataset.filter] = el.value; writeFilters(f); return; }
  if (el.dataset.amen) { const a = S.draft.amen, k = el.dataset.amen; if (el.checked) a.push(k); else a.splice(a.indexOf(k), 1); return; }
  if (el.dataset.field === 'advNone') { S.draft.advNone = el.checked; if (el.checked) S.draft.advance = ''; render(); return; }
  if (el.dataset.other && el.dataset.k === 'rec') { S.draft.others[+el.dataset.other].rec = el.value === '1'; refreshPreview(); return; }
  if (el.dataset.field && el.tagName === 'SELECT') { S.draft[el.dataset.field] = el.value; if (S.errors[el.dataset.field]) { delete S.errors[el.dataset.field]; render(); } }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.field && el.dataset.field !== 'advNone' && el.tagName !== 'SELECT') { S.draft[el.dataset.field] = el.value; refreshPreview(); }
  if (el.dataset.other && el.dataset.k !== 'rec') { S.draft.others[+el.dataset.other][el.dataset.k] = el.value; refreshPreview(); }
});
function refreshPreview() { const p = $('#draft-receipt'); if (p) p.innerHTML = receipt(Object.assign(previewListing(), draftListing())); }

document.addEventListener('submit', e => {
  const f = e.target; e.preventDefault();
  if (f.id === 'home-search') {
    const fd = new FormData(f), q = {}; for (const k of ['area', 'max', 'beds']) q[k] = fd.get(k) || ''; writeFilters(q); return;
  }
  if (f.id === 'signin-form') {
    const ph = toLatin($('#s-phone').value.trim()).replace(/[\s-]/g, ''), pw = $('#s-pass').value;
    const okP = /^(?:\+?880|0)1[3-9]\d{8}$/.test(ph), okW = pw.length >= 8;
    const okN = !S.signup || $('#s-name').value.trim().length > 0;
    const taken = S.signup && okP && Object.values(PEOPLE).some(x => x.phone === '0' + ph.slice(-10));
    $('#s-phone-err').textContent = t(taken ? 'phone_taken' : 'phone_err');
    $('#s-phone-err').hidden = okP && !taken; $('#s-pass-err').hidden = okW;
    $('#s-phone').setAttribute('aria-invalid', String(!okP || taken)); $('#s-pass').setAttribute('aria-invalid', String(!okW));
    if (S.signup) { $('#s-name-err').hidden = okN; $('#s-name').setAttribute('aria-invalid', String(!okN)); }
    if (!okP || !okW || !okN || taken) return;
    S.signedIn = true; closeDialog(); toast(t('signed_in'));
    const p = S.pending; S.pending = null;
    if (p && p.k === 'post') { S.role = 'owner'; go('#/post'); return; }
    if (p && p.k === 'save') { S.saved.add(p.id); toast(t('toast_saved')); }
    render(); return;
  }
  if (f.id === 'report-form') {
    const r = f.querySelector('input[name="reason"]:checked');
    $('#r-err').hidden = !!r; if (!r) return;
    const det = $('#r-details').value.trim();
    REPORTS.unshift({ id: 'R' + Date.now(), listing: f.dataset.id, reason: r.value, hours: 0.2, open: true, details: { bn: det, en: det } });
    closeDialog(); toast(t('report_sent')); return;
  }
  if (f.id === 'reason-form') {
    const txt = $('#m-reason').value.trim();
    $('#m-err').hidden = txt.length > 0; if (!txt) return;
    const l = byId(f.dataset.id); l.status = f.dataset.kind; l.reason = { bn: txt, en: txt };
    closeDialog(); toast(t(f.dataset.kind === 'changes' ? 't_changes' : 't_rejected')); render();
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.filtersOpen) { S.filtersOpen = false; render(); } });
window.addEventListener('hashchange', () => {
  S.filtersOpen = false;
  if (!location.hash.startsWith('#/post')) {
    S.submitted = false;
    if (S.editId && !liveEdit()) autosave();
    const l = S.editId && byId(S.editId);
    if (l && l.status !== 'draft') startNew();
  }
  render();
});
render();
</script>
</body>
</html>
